<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>總務處工作平台</title>
<style>
:root{
  --bg:#eaf1fb; --blue:#3f74d6; --blue-deep:#2c57b0;
  --card:#ffffff; --text:#2b3140; --muted:#8b94a7;
  --border:#e4e9f2; --orange:#f2933d; --orange-soft:#fdebd8;
  --purple:#e7e0f7; --purple-deep:#7a63d6; --green:#2e9e5b;
  --shadow:0 3px 14px rgba(50,80,150,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Helvetica Neue",Arial,sans-serif;font-size:15px}
input,select,textarea,button{font-family:inherit}

/* 登入遮罩 */
.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#dce8fb,#eaf1fb);display:flex;align-items:center;justify-content:center;z-index:50}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:30px 30px 26px;width:340px;text-align:center}
.login-card img{width:64px;height:64px;border-radius:16px;object-fit:cover;margin-bottom:10px}
.login-card h2{margin:4px 0 2px;font-size:20px}
.login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login-card label{display:block;text-align:left;font-size:13px;color:var(--muted);margin:10px 2px 4px}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px}
.login-card .btn{width:100%;margin-top:18px;padding:11px}
.login-hint{margin-top:14px;font-size:11px;color:var(--muted);line-height:1.6}
.login-err{color:#d9534f;font-size:13px;min-height:18px;margin-top:8px}

.app{display:none;min-height:100vh}
.app.show{display:flex}
.sidebar{width:248px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 18px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.brand img{width:46px;height:46px;border-radius:12px;object-fit:cover}
.brand-text b{font-size:17px;display:block;line-height:1.25}
.brand-text span{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:none;background:transparent;border-radius:12px;font-size:15px;color:var(--text);cursor:pointer;text-align:left;transition:.15s}
.nav-item .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--purple);color:var(--purple-deep);font-weight:600}
.nav-item.active .dot{background:var(--purple-deep)}
.sidebar-foot{margin-top:auto;text-align:center;color:var(--muted);font-size:11px;padding-top:18px}
.sidebar-foot img{width:60px;height:60px;object-fit:cover;margin-bottom:6px;border-radius:12px}
.main{flex:1;padding:26px 30px;max-width:1180px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.topbar h1{margin:0;font-size:22px}
.topbar .date{color:var(--muted);font-size:13px;margin-top:4px}
.welcome{display:flex;align-items:center;gap:10px}
.welcome img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.welcome #welcomeText{font-size:14px;line-height:1.3}
.welcome #welcomeText b{color:var(--blue-deep)}
.sync-box{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-right:2px}
.sync-stat{font-size:11px;color:var(--muted)}
.btn{background:var(--orange);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:var(--orange-soft);color:var(--orange)}
.btn.purple{background:var(--purple);color:var(--purple-deep)}
.btn.green{background:var(--green);color:#fff}
.module{display:none}
.module.active{display:block}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);min-width:128px}
.stat .n{font-size:26px;font-weight:700;color:var(--blue)}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.stat.orange .n{color:var(--orange)}
.acc-cat{border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;background:var(--card)}
.acc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.acc-head .ct{font-weight:600;font-size:15px;flex:1}
.acc-head .badge{background:var(--orange);color:#fff;font-size:12px;border-radius:999px;padding:2px 9px;min-width:22px;text-align:center}
.acc-head .add{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.acc-body{padding:4px 16px 16px;display:none}
.acc-cat.open .acc-body{display:block}
.acc-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px dashed var(--border)}
.acc-item:first-child{border-top:none}
.acc-main{flex:1}
.acc-text{font-size:14.5px;line-height:1.45}
.acc-meta{font-size:12px;color:var(--muted);margin-top:4px}
.acc-meta select{padding:2px 6px;border-radius:6px;border:1px solid var(--border);font-size:12px}
.acc-ops{display:flex;gap:6px;flex-shrink:0}
.acc-add{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 2px;border-top:1px dashed var(--border)}
.acc-add input,.acc-add select{padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.acc-add input[type=text]{flex:1;min-width:160px}
.acc-add input[type=date]{width:150px}
.acc-add select{min-width:110px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-left:6px}
.tag.未完成{background:var(--orange-soft);color:var(--orange)}
.tag.進行中{background:#e8f0ff;color:var(--blue-deep)}
.tag.已完成{background:#e6f6ec;color:var(--green)}

.rep-card{margin-bottom:16px}
.rep-cols{display:flex;gap:16px;flex-wrap:wrap}
.rep-col{flex:1;min-width:260px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px}
.rep-col h4{margin:0 0 10px;font-size:14px}
.rep-col h4 .cnt{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.rep-item{display:flex;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.rep-item .t{flex:1;font-size:14px;line-height:1.45;white-space:pre-wrap}
.rep-item .ops{display:flex;gap:6px;flex-shrink:0}
.rep-add{display:flex;gap:8px;margin-top:6px}
.rep-add input{flex:1;padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.rep-edit{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:14px;resize:vertical;min-height:38px}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head .mt{font-size:17px;font-weight:600}
.cal-head .nav-btns{display:flex;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal-cell{position:relative;min-height:62px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:6px;cursor:pointer;font-size:13px;transition:.12s}
.cal-cell:hover{border-color:var(--blue)}
.cal-cell.muted{color:#c4ccda;background:#f7f9fc}
.cal-cell.today{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft) inset}
.cal-cell .cnum{font-weight:600}
.cal-cell .cdot{position:absolute;right:7px;top:7px;min-width:18px;height:18px;border-radius:999px;background:var(--orange);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cal-cell.sel{background:var(--purple)}
.meet-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.meet-form .f{display:flex;flex-direction:column;gap:4px}
.meet-form label{font-size:12px;color:var(--muted)}
.meet-form input,.meet-form textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.meet-form input[type=text]{min-width:160px}
.meet-form textarea{min-width:200px;min-height:40px;resize:vertical}
.meet-item{display:flex;align-items:flex-start;gap:10px;border-top:1px dashed var(--border);padding:10px 0}
.meet-item:first-child{border-top:none}
.meet-main{flex:1}
.meet-main .mt{font-weight:600}
.meet-main .mi{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.meet-ops{display:flex;gap:6px;flex-shrink:0}
.meet-edit{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.meet-edit input,.meet-edit textarea{padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}
.edit-row{display:flex;flex-wrap:wrap;gap:8px;width:100%;align-items:center}
.edit-row input,.edit-row select,.edit-row textarea{padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.edit-row input[type=text]{flex:1;min-width:160px}
</style>
</head>
<body>

<!-- 登入 -->
<div id="login" class="login-overlay">
  <div class="login-card">
    <img src="bear1.jpg" alt="吉祥物">
    <h2>總務處工作平台</h2>
    <p>請輸入帳號與密碼登入</p>
    <label>帳號</label>
    <input id="loginUser" placeholder="例如 ZYQ / LUDH ..." autocomplete="off">
    <label>密碼</label>
    <input id="loginPw" type="password" placeholder="密碼" autocomplete="off">
    <div class="login-err" id="loginErr"></div>
    <button class="btn" onclick="doLogin()">登入</button>
    <div class="login-hint">帳號：事務組長 ZYQ（超級管理員）｜總務處主任 LUDH｜工務組長 LIXC｜文書組長 YAOTY｜交通組長 SHEN｜出納組長 RONG</div>
  </div>
</div>

<!-- 主程式 -->
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><img src="bear1.jpg" alt="吉祥物"><div class="brand-text"><b>總務處工作平台</b><span>Zongwu Office</span></div></div>
    <nav class="nav">
      <button class="nav-item active" data-mod="acc" onclick="switchMod('acc')"><span class="dot"></span>主任交辦事項</button>
      <button class="nav-item" data-mod="rep" onclick="switchMod('rep')"><span class="dot"></span>各處室工作報告</button>
      <button class="nav-item" data-mod="cal" onclick="switchMod('cal')"><span class="dot"></span>會議管理</button>
    </nav>
    <div class="sidebar-foot"><img src="bear2.jpg" alt="吉祥物2"><br>總務處 溫馨提醒您</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="modTitle">主任交辦事項</h1>
        <div class="date" id="todayDate"></div>
      </div>
      <div class="welcome">
        <div class="sync-box">
          <button class="btn sm" id="syncBtn" onclick="syncNow()">⟳ 同步資料</button>
          <div class="sync-stat" id="syncStat">本機模式</div>
        </div>
        <img src="bear1.jpg" id="welcomeBear" alt="吉祥物">
        <div id="welcomeText">…</div>
        <button class="btn ghost sm" id="logoutBtn" onclick="doLogout()">登出</button>
      </div>
    </div>

    <!-- 模組一：主任交辦事項 -->
    <section class="module active" id="mod-acc">
      <div class="sub">主任交辦事項 · 六組垂直手風琴，點標題展開／收合</div>
      <div class="stats" id="accStats"></div>
      <div id="accList"></div>
    </section>

    <!-- 模組二：各處室工作報告 -->
    <section class="module" id="mod-rep">
      <div class="sub">各處室工作報告 · 每組分「已完成」與「即將進行事項」</div>
      <div style="text-align:right;margin-bottom:12px"><button class="btn" onclick="exportWord()">彙整輸出 Word 檔</button></div>
      <div id="repList"></div>
    </section>

    <!-- 模組三：會議管理 -->
    <section class="module" id="mod-cal">
      <div class="sub">會議管理 · 月曆檢視，橘色數字為當日會議數</div>
      <div class="card">
        <div class="cal-head">
          <div class="mt" id="calTitle"></div>
          <div class="nav-btns">
            <button class="btn ghost sm" onclick="calShift(-1)">‹ 上月</button>
            <button class="btn ghost sm" onclick="calShift(0)">今天</button>
            <button class="btn ghost sm" onclick="calShift(1)">下月 ›</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 12px;font-size:16px">登錄會議</h3>
        <form class="meet-form" id="meetForm" onsubmit="return addMeeting()">
          <div class="f"><label>姓名</label>
            <select id="m_name" onchange="toggleOther('name')">
              <option value="">請選擇</option>
              <option>呂德鈞</option><option>曾玉綺</option><option>李學初</option><option>姚亭伃</option><option>沈德顼</option><option>戎雪妮</option>
              <option value="__other__">其他</option>
            </select>
            <input type="text" id="m_name_other" maxlength="20" placeholder="其他姓名（20字內）" style="display:none;margin-top:4px">
          </div>
          <div class="f"><label>時間</label><input type="datetime-local" id="m_time" required></div>
          <div class="f"><label>會議主題</label><input type="text" id="m_topic" placeholder="主題" required></div>
          <div class="f"><label>地點</label>
            <select id="m_place" onchange="toggleOther('place')">
              <option value="">請選擇</option>
              <option>第一會議室</option><option>招生接待室</option><option>培方館</option><option>演藝廳</option>
              <option value="__other__">其他</option>
            </select>
            <input type="text" id="m_place_other" maxlength="20" placeholder="其他地點（20字內）" style="display:none;margin-top:4px">
          </div>
          <div class="f" style="flex:1;min-width:200px"><label>備註（選填）</label><textarea id="m_note" placeholder="備註"></textarea></div>
          <button class="btn" type="submit">登錄會議</button>
        </form>
      </div>
      <div class="card">
        <h3 style="margin:0 0 10px;font-size:16px">會議紀錄</h3>
        <div id="meetList"></div>
      </div>
    </section>
  </main>
</div>

<script src="config.js"></script>
<script src="supabase.min.js"></script>
<script>
/* ============ 帳號與權限 ============ */
const ACCOUNTS=[
  {u:'ZYQ',  p:'0824', name:'事務組長',   role:'admin'},
  {u:'LUDH', p:'8112', name:'總務處主任', role:'user'},
  {u:'LIXC', p:'8110', name:'工務組長',   role:'user'},
  {u:'YAOTY',p:'8111', name:'文書組長',   role:'user'},
  {u:'SHEN', p:'8108', name:'交通組長',   role:'user'},
  {u:'RONG', p:'8309', name:'出納組長',   role:'user'}
];
let currentUser=null;
function loadUser(){ try{const s=localStorage.getItem('chu_user');if(s)currentUser=JSON.parse(s);}catch(e){} }
function saveUser(){ if(currentUser)localStorage.setItem('chu_user',JSON.stringify(currentUser)); else localStorage.removeItem('chu_user'); }
function doLogin(){
  const u=document.getElementById('loginUser').value.trim().toUpperCase();
  const p=document.getElementById('loginPw').value;
  const a=ACCOUNTS.find(x=>x.u===u && x.p===p);
  if(!a){ document.getElementById('loginErr').textContent='帳號或密碼錯誤'; return; }
  currentUser={u:a.u,name:a.name,role:a.role}; saveUser();
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('show');
  boot();
}
function doLogout(){
  currentUser=null; saveUser();
  document.getElementById('app').classList.remove('show');
  document.getElementById('login').style.display='flex';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPw').value='';
  document.getElementById('loginErr').textContent='';
}
// 權限：admin 可改全部；user 僅可改自己寫入（或舊資料無建立者）
function canModify(rec){ if(!currentUser)return false; if(currentUser.role==='admin')return true; return !rec.createdBy || rec.createdBy===currentUser.u; }
function meTag(){ return currentUser?('（'+currentUser.name+' '+currentUser.u+(currentUser.role==='admin'?' · 超級管理員':'')+'）'):''; }

/* ============ 雲端同步 ============ */
let _sb=null;
const cloudOn=!!(window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY);
if(cloudOn){ try{ _sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){ _sb=null; } }
async function sbGet(key){ if(!_sb)return undefined; const {data,error}=await _sb.from('app_data').select('value').eq('key',key).single(); if(error)return undefined; return data?data.value:null; }
async function sbSet(key,val){ if(!_sb)return false; const {error}=await _sb.from('app_data').upsert({key,value:val},{onConflict:'key'}); return !error; }

/* ============ 本地資料 ============ */
const LSacc='chu_acc', LSrep='chu_reports', LSmeet='chu_meetings';
let acc=[], reports={}, meetings=[];
const CATS=['共通事項','事務組','工務組','文書組','交通組','出納組'];
const GROUPS=['事務組','工務組','文書組','交通組','出納組'];
const OWNERS=['曾玉綺','李學初','姚亭伃','沈德顼','戎雪妮'];
const STATUSES=['未完成','進行中','已完成'];

function loadLocal(){
  try{ acc=JSON.parse(localStorage.getItem(LSacc)||'[]'); }catch(e){ acc=[]; }
  try{ reports=JSON.parse(localStorage.getItem(LSrep)||'{}'); }catch(e){ reports={}; }
  try{ meetings=JSON.parse(localStorage.getItem(LSmeet)||'[]'); }catch(e){ meetings=[]; }
  GROUPS.forEach(g=>{ if(!reports[g])reports[g]={done:[],upcoming:[]}; });
}
function saveAcc(){ localStorage.setItem(LSacc,JSON.stringify(acc)); if(_sb)sbSet(LSacc,acc); }
function saveReports(){ localStorage.setItem(LSrep,JSON.stringify(reports)); if(_sb)sbSet(LSrep,reports); }
function saveMeet(){ localStorage.setItem(LSmeet,JSON.stringify(meetings)); if(_sb)sbSet(LSmeet,meetings); }

function isUserEditing(){ const a=document.activeElement; if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))return true; return false; }
function nowStr(){ const d=new Date(); const p=n=>(''+n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
async function refreshAll(){
  if(!_sb)return;
  try{
    const [a,r,m]=await Promise.all([sbGet(LSacc),sbGet(LSrep),sbGet(LSmeet)]);
    if(a)acc=a; if(r)reports=r; if(m)meetings=m;
    GROUPS.forEach(g=>{ if(!reports[g])reports[g]={done:[],upcoming:[]}; });
    if(!isUserEditing()) renderAll();
    const s=document.getElementById('syncStat'); if(s)s.textContent='已同步 '+nowStr();
  }catch(e){
    const s=document.getElementById('syncStat'); if(s)s.textContent='雲端讀取失敗（本機模式）';
  }
}
function syncNow(){ if(!_sb){const s=document.getElementById('syncStat');if(s)s.textContent='本機模式（未連雲端）';return;} refreshAll(); }

/* ============ 渲染 ============ */
const TITLE={acc:'主任交辦事項',rep:'各處室工作報告',cal:'會議管理'};
function switchMod(m){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.mod===m));
  document.querySelectorAll('.module').forEach(s=>s.classList.remove('active'));
  document.getElementById('mod-'+m).classList.add('active');
  document.getElementById('modTitle').textContent=TITLE[m];
  if(m==='cal')renderCal();
}
function renderAll(){ renderAcc(); renderRep(); renderCal(); renderMeet(); }

function ownerOptions(sel){ return '<option value="">請選擇</option>'+OWNERS.map(o=>`<option ${o===sel?'selected':''}>${o}</option>`).join(''); }
function statusOptions(sel){ return STATUSES.map(s=>`<option ${s===sel?'selected':''}>${s}</option>`).join(''); }
function esc(s){ return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function uid(){ return Date.now()+'-'+Math.floor(Math.random()*1e4); }

let addingCat=null, editingAcc=null;
function renderAcc(){
  const total=acc.length;
  const undone=acc.filter(x=>x.status!=='已完成').length;
  const perCat=CATS.map(c=>acc.filter(x=>x.cat===c && x.status!=='已完成').length);
  document.getElementById('accStats').innerHTML=
    `<div class="stat"><div class="n">${total}</div><div class="l">交辦總數</div></div>`+
    `<div class="stat orange"><div class="n">${undone}</div><div class="l">未完成數</div></div>`+
    CATS.map((c,i)=>`<div class="stat"><div class="n">${perCat[i]}</div><div class="l">${c} 待辦</div></div>`).join('');

  let html='';
  CATS.forEach(cat=>{
    const items=acc.filter(x=>x.cat===cat);
    const und=items.filter(x=>x.status!=='已完成').length;
    html+=`<div class="acc-cat open"><div class="acc-head" onclick="toggleCat(this)"><span class="ct">${cat}</span><span class="badge">${und}</span><button class="add" onclick="event.stopPropagation();startAdd('${cat}')">＋新增</button></div><div class="acc-body">`;
    if(addingCat===cat){
      html+=`<div class="acc-add">
        <input type="text" id="a_text" placeholder="交辦內容">
        <select id="a_owner">${ownerOptions('')}</select>
        <input type="date" id="a_due">
        <select id="a_status">${statusOptions('未完成')}</select>
        <button class="btn sm" onclick="addAcc('${cat}')">新增</button>
        <button class="btn ghost sm" onclick="addingCat=null;renderAcc()">取消</button>
      </div>`;
    }
    if(items.length===0 && addingCat!==cat){ html+=`<div class="empty">尚無交辦事項</div>`; }
    items.forEach(it=>{
      if(editingAcc===it.id){
        html+=`<div class="acc-item"><div class="edit-row" style="width:100%">
          <input type="text" id="e_text" value="${esc(it.text)}">
          <select id="e_owner">${ownerOptions(it.owner)}</select>
          <input type="date" id="e_due" value="${esc(it.due)}">
          <select id="e_status">${statusOptions(it.status)}</select>
          <button class="btn sm" onclick="saveAccEdit('${it.id}')">儲存</button>
          <button class="btn ghost sm" onclick="editingAcc=null;renderAcc()">取消</button>
        </div></div>`;
      }else{
        const owned=canModify(it);
        html+=`<div class="acc-item"><div class="acc-main">
          <div class="acc-text">${esc(it.text)} <span class="tag ${it.status}">${it.status}</span></div>
          <div class="acc-meta">負責人：${esc(it.owner||'—')} ｜ 期限：${esc(it.due||'—')}
            ${owned?`<select onchange="chgStatus('${it.id}',this.value)">${statusOptions(it.status)}</select>`:''}
            ${it.createdBy?`｜ 建立者：${esc(it.createdBy)}`:''}
          </div>
        </div><div class="acc-ops">`+
          (owned?`<button class="btn ghost sm" onclick="editingAcc='${it.id}';renderAcc()">修改</button>`:'')+
          (owned?`<button class="btn sm" style="background:#e35d4f" onclick="delAcc('${it.id}')">刪除</button>`:'')+
        `</div></div>`;
      }
    });
    html+=`</div></div>`;
  });
  document.getElementById('accList').innerHTML=html;
}
function toggleCat(el){ el.parentElement.classList.toggle('open'); }
function startAdd(cat){ addingCat=cat; editingAcc=null; renderAcc(); const t=document.getElementById('a_text'); if(t)t.focus(); }
function addAcc(cat){
  const text=document.getElementById('a_text').value.trim();
  const owner=document.getElementById('a_owner').value;
  const due=document.getElementById('a_due').value;
  const status=document.getElementById('a_status').value;
  if(!text){ alert('請填寫交辦內容'); return; }
  acc.push({id:uid(),cat,text,owner,due,status,createdBy:currentUser.u});
  addingCat=null; saveAcc(); renderAcc();
}
function chgStatus(id,st){ const it=acc.find(x=>x.id===id); if(!it)return; it.status=st; saveAcc(); renderAcc(); }
function saveAccEdit(id){
  const it=acc.find(x=>x.id===id); if(!it)return;
  it.text=document.getElementById('e_text').value.trim()||it.text;
  it.owner=document.getElementById('e_owner').value;
  it.due=document.getElementById('e_due').value;
  it.status=document.getElementById('e_status').value;
  editingAcc=null; saveAcc(); renderAcc();
}
function delAcc(id){ if(!confirm('確定刪除此交辦事項？'))return; acc=acc.filter(x=>x.id!==id); saveAcc(); renderAcc(); }

/* 報告 */
let editingRep=null; // {group,type,id}
function renderRep(){
  let html='';
  GROUPS.forEach(g=>{
    const r=reports[g]||{done:[],upcoming:[]};
    html+=`<div class="card rep-card"><h3 style="margin:0 0 12px;font-size:16px">${g}</h3><div class="rep-cols">`;
    [['done','已完成事項'],['upcoming','即將進行事項']].forEach(([type,label])=>{
      const arr=r[type]||[];
      html+=`<div class="rep-col"><h4>${label}<span class="cnt">${arr.length} 筆</span></h4>`;
      arr.forEach(it=>{
        if(editingRep && editingRep.group===g && editingRep.type===type && editingRep.id===it.id){
          html+=`<div class="rep-item"><textarea class="rep-edit" id="rep_e">${esc(it.text)}</textarea></div>
            <div style="display:flex;gap:6px;margin:6px 0 10px">
              <button class="btn sm" onclick="saveRepEdit('${g}','${type}','${it.id}')">儲存</button>
              <button class="btn ghost sm" onclick="editingRep=null;renderRep()">取消</button>
            </div>`;
        }else{
          const owned=canModify(it);
          html+=`<div class="rep-item"><div class="t">${esc(it.text)}</div><div class="ops">`+
            (owned?`<button class="btn ghost sm" onclick="editingRep={group:'${g}',type:'${type}',id:'${it.id}'};renderRep()">修改</button>`:'')+
            (owned?`<button class="btn sm" style="background:#e35d4f" onclick="delRep('${g}','${type}','${it.id}')">刪除</button>`:'')+
          `</div></div>`;
        }
      });
      html+=`<div class="rep-add"><input type="text" id="rep_${g}_${type}" placeholder="新增${label}…" onkeydown="if(event.key==='Enter')addRep('${g}','${type}')"><button class="btn sm" onclick="addRep('${g}','${type}')">＋</button></div>`;
      html+=`</div>`;
    });
    html+=`</div></div>`;
  });
  document.getElementById('repList').innerHTML=html;
}
function addRep(g,type){
  const el=document.getElementById('rep_'+g+'_'+type); if(!el)return;
  const text=el.value.trim(); if(!text){ alert('請填寫內容'); return; }
  if(!reports[g])reports[g]={done:[],upcoming:[]};
  reports[g][type].push({id:uid(),text,createdBy:currentUser.u});
  saveReports(); renderRep();
}
function saveRepEdit(g,type,id){
  const arr=(reports[g]||{})[type]||[]; const it=arr.find(x=>x.id===id); if(!it)return;
  const v=document.getElementById('rep_e').value.trim(); if(v)it.text=v;
  editingRep=null; saveReports(); renderRep();
}
function delRep(g,type,id){ if(!confirm('確定刪除此筆報告？'))return; reports[g][type]=reports[g][type].filter(x=>x.id!==id); saveReports(); renderRep(); }

/* 會議 */
let calY=null,calM=null,selDay=null,editingMeet=null;
const DOW=['日','一','二','三','四','五','六'];
const MEET_NAMES=['呂德鈞','曾玉綺','李學初','姚亭伃','沈德顼','戎雪妮'];
const MEET_PLACES=['第一會議室','招生接待室','培方館','演藝廳'];
function toggleOther(which){
  const sel=document.getElementById('m_'+which);
  const inp=document.getElementById('m_'+which+'_other');
  if(sel.value==='__other__'){ inp.style.display='block'; inp.focus(); }
  else { inp.style.display='none'; inp.value=''; }
}
function toggleOtherEdit(which){
  const sel=document.getElementById('me_'+which);
  const inp=document.getElementById('me_'+which+'_other');
  if(sel.value==='__other__'){ inp.style.display='block'; inp.focus(); }
  else { inp.style.display='none'; inp.value=''; }
}
function meetField(field,val){
  const list = field==='name' ? MEET_NAMES : MEET_PLACES;
  const inList = list.includes(val);
  let sel='<select id="me_'+field+'" onchange="toggleOtherEdit(\''+field+'\')"><option value="">請選擇</option>'+
    list.map(o=>'<option'+(o===val?' selected':'')+'>'+o+'</option>').join('')+
    '<option value="__other__"'+(!inList&&val?' selected':'')+'>其他</option></select>';
  let inp='<input type="text" id="me_'+field+'_other" maxlength="20" placeholder="其他（20字內）" value="'+(inList?'':esc(val))+'" style="display:'+(inList?'none':'block')+';margin-top:4px">';
  return sel+inp;
}
function renderCal(){
  const d=new Date(); if(calY==null){calY=d.getFullYear();calM=d.getMonth();}
  document.getElementById('calTitle').textContent=calY+' 年 '+(calM+1)+' 月';
  const first=new Date(calY,calM,1).getDay();
  const days=new Date(calY,calM+1,0).getDate();
  const today=d.getDate(), tY=d.getFullYear(), tM=d.getMonth();
  let html='';
  DOW.forEach(w=>`<div class="cal-dow">${w}</div>`);
  for(let i=0;i<first;i++) html+=`<div class="cal-cell muted"></div>`;
  for(let day=1;day<=days;day++){
    const cnt=meetings.filter(m=>{ const t=new Date(m.time); return t.getFullYear()===calY&&t.getMonth()===calM&&t.getDate()===day; }).length;
    const isT=(day===today&&calY===tY&&calM===tM);
    const isSel=(selDay===day);
    html+=`<div class="cal-cell${isT?' today':''}${isSel?' sel':''}" onclick="pickDay(${day})">
      <span class="cnum">${day}</span>${cnt?`<span class="cdot">${cnt}</span>`:''}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}
function calShift(n){ if(n===0){const d=new Date();calY=d.getFullYear();calM=d.getMonth();}else{const d=new Date(calY,calM+n,1);calY=d.getFullYear();calM=d.getMonth();} renderCal(); }
function pickDay(day){
  selDay=day; renderCal();
  const p=n=>(''+n).padStart(2,'0');
  document.getElementById('m_time').value=`${calY}-${p(calM+1)}-${p(day)}T09:00`;
}
function addMeeting(){
  const nameSel=document.getElementById('m_name');
  const name=nameSel.value==='__other__'?document.getElementById('m_name_other').value.trim():nameSel.value.trim();
  const time=document.getElementById('m_time').value;
  const topic=document.getElementById('m_topic').value.trim();
  const placeSel=document.getElementById('m_place');
  const place=placeSel.value==='__other__'?document.getElementById('m_place_other').value.trim():placeSel.value.trim();
  const note=document.getElementById('m_note').value.trim();
  if(!name||!time||!topic){ alert('請填寫姓名、時間與會議主題'); return false; }
  meetings.push({id:uid(),name,time,topic,place,note,createdBy:currentUser.u});
  saveMeet(); renderMeet(); renderCal();
  document.getElementById('meetForm').reset();
  ['name','place'].forEach(w=>{const i=document.getElementById('m_'+w+'_other'); if(i){i.style.display='none'; i.value='';}});
  selDay=null;
  return false;
}
function fmtTime(t){ if(!t)return '—'; const d=new Date(t); const p=n=>(''+n).padStart(2,'0'); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function renderMeet(){
  const arr=[...meetings].sort((a,b)=>new Date(a.time)-new Date(b.time));
  let html='';
  if(arr.length===0){ html='<div class="empty">尚無會議紀錄</div>'; }
  arr.forEach(m=>{
    if(editingMeet===m.id){
      html+=`<div class="meet-item"><div class="meet-edit">
        ${meetField('name',m.name)}
        <input type="datetime-local" id="me_time" value="${esc((m.time||'').replace(' ','T'))}">
        <input type="text" id="me_topic" value="${esc(m.topic)}" placeholder="主題">
        ${meetField('place',m.place)}
        <textarea id="me_note" placeholder="備註">${esc(m.note)}</textarea>
        <button class="btn sm" onclick="saveMeetEdit('${m.id}')">儲存</button>
        <button class="btn ghost sm" onclick="editingMeet=null;renderMeet()">取消</button>
      </div></div>`;
    }else{
      const owned=canModify(m);
      html+=`<div class="meet-item"><div class="meet-main">
        <div class="mt">${esc(m.topic)}</div>
        <div class="mi">時間：${fmtTime(m.time)} ｜ 姓名：${esc(m.name)} ｜ 地點：${esc(m.place||'—')} ${m.createdBy?('｜ 建立者：'+esc(m.createdBy)):''} ${m.note?('｜ 備註：'+esc(m.note)):''}</div>
      </div><div class="meet-ops">`+
        (owned?`<button class="btn ghost sm" onclick="editingMeet='${m.id}';renderMeet()">修改</button>`:'')+
        (owned?`<button class="btn sm" style="background:#e35d4f" onclick="delMeeting('${m.id}')">刪除</button>`:'')+
      `</div></div>`;
    }
  });
  document.getElementById('meetList').innerHTML=html;
}
function saveMeetEdit(id){
  const m=meetings.find(x=>x.id===id); if(!m)return;
  const nameSel=document.getElementById('me_name');
  m.name=(nameSel.value==='__other__'?document.getElementById('me_name_other').value.trim():nameSel.value.trim())||m.name;
  m.time=document.getElementById('me_time').value;
  m.topic=document.getElementById('me_topic').value.trim()||m.topic;
  const placeSel=document.getElementById('me_place');
  m.place=(placeSel.value==='__other__'?document.getElementById('me_place_other').value.trim():placeSel.value.trim())||m.place;
  m.note=document.getElementById('me_note').value;
  editingMeet=null; saveMeet(); renderMeet(); renderCal();
}
function delMeeting(id){ if(!confirm('確定刪除此會議紀錄？'))return; meetings=meetings.filter(x=>x.id!==id); saveMeet(); renderMeet(); renderCal(); }

/* Word 匯出 */
function exportWord(){
  const d=new Date(); const p=n=>(''+n).padStart(2,'0');
  const dateStr=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
  const oneJan=new Date(d.getFullYear(),0,1); const week=Math.ceil((((d-oneJan)/86400000)+oneJan.getDay()+1)/7);
  let rows='';
  GROUPS.forEach(g=>{
    const r=reports[g]||{done:[],upcoming:[]};
    rows+=`<tr><th rowspan="2" style="background:#fdebd8">${g}</th><td style="width:120px;background:#eaf1fb">已完成事項</td><td>${r.done.map(x=>esc(x.text)).join('<br>')||'—'}</td></tr>`;
    rows+=`<tr><td style="background:#eaf1fb">即將進行事項</td><td>${r.upcoming.map(x=>esc(x.text)).join('<br>')||'—'}</td></tr>`;
  });
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>body{font-family:"標楷體",DFKai-SB,serif;font-size:14pt}h1{text-align:center}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px 8px;vertical-align:top}</style></head><body>
    <h1>總務處各處室工作報告</h1>
    <p>彙整日期：${dateStr}　｜　本週次：第 ${week} 週</p>
    <table>${rows}</table></body></html>`;
  const blob=new Blob(['\ufeff'+html],{type:'application/msword'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='總務處工作報告_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.doc'; document.body.appendChild(a); a.click();
}

/* ============ 啟動 ============ */
function boot(){
  document.getElementById('todayDate').textContent='今天：'+new Date().toLocaleDateString('zh-Hant');
  document.getElementById('welcomeText').innerHTML='<b>'+currentUser.name+'</b> '+currentUser.u+(currentUser.role==='admin'?'（超級管理員）':'');
  loadLocal();
  renderAcc(); renderRep(); renderCal(); renderMeet();
  if(_sb){ document.getElementById('syncStat').textContent='同步中…'; refreshAll(); }
  else { document.getElementById('syncStat').textContent='本機模式（未連雲端）'; }
}
window.addEventListener('DOMContentLoaded',()=>{
  loadUser();
  if(currentUser){ document.getElementById('login').style.display='none'; document.getElementById('app').classList.add('show'); boot(); }
  else { document.getElementById('login').style.display='flex'; document.getElementById('app').classList.remove('show'); }
  document.getElementById('loginPw').addEventListener('keydown',e=>{ if(e.key==='Enter')doLogin(); });
});
setInterval(()=>{ if(currentUser && _sb) refreshAll(); },20000);
</script>
